[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "granflows-service-data"
version = "0.1.1"
description = "Cliente Python da Data API dos microserviços GranFlows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # A mesma versão que os serviços consumidores já usam.
  # Faixa e não pin exato: este pacote é uma DEPENDÊNCIA, e pinar aqui forçaria
  # conflito de resolução com o pin do próprio serviço.
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["granflows_service_data"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101 (assert) só nos testes, que é onde assert é a ferramenta.
per-file-ignores = { "tests/*" = ["S101", "S105"] }

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
